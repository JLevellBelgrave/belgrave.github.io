<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Club cricket career records, top 10s and honour boards, 1922/23 to 2025/26.">
<title>The Scorebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f6f3ea; --panel:#fffdf8; --panel-2:#f0ece0; --ink:#1c1a16; --ink-2:#514c42;
  --ink-3:#867f71; --line:#ddd6c6; --line-2:#c9c0ab;
  --turf:#1d5c3d; --turf-2:#2a7d53; --ball:#8f2d21; --ball-2:#b33d2c;
  --gold:#8a6a1f; --shadow:0 1px 2px rgba(28,26,22,.06),0 8px 24px -12px rgba(28,26,22,.18);
  --g1:#1d5c3d; --g2:#1f6f7a; --g3:#8a6a1f; --g4:#8f4a21; --g5:#5b3a7a; --g6:#3d5a8f;
  --gW:#8f2d5e; --gU:#8a8378;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --panel:#1b1e24; --panel-2:#22262e; --ink:#eae6dd; --ink-2:#b3ada1;
    --ink-3:#807a70; --line:#2c313a; --line-2:#3b414c;
    --turf:#5fbc8b; --turf-2:#7fd0a4; --ball:#e08a76; --ball-2:#eda58f;
    --gold:#d9b45e; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --g1:#5fbc8b; --g2:#5fb8c6; --g3:#d9b45e; --g4:#e0906a; --g5:#a98bd1; --g6:#7fa3e0;
    --gW:#e086b0; --gU:#9a938a;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1b1e24; --panel-2:#22262e; --ink:#eae6dd; --ink-2:#b3ada1;
  --ink-3:#807a70; --line:#2c313a; --line-2:#3b414c;
  --turf:#5fbc8b; --turf-2:#7fd0a4; --ball:#e08a76; --ball-2:#eda58f;
  --gold:#d9b45e; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --g1:#5fbc8b; --g2:#5fb8c6; --g3:#d9b45e; --g4:#e0906a; --g5:#a98bd1; --g6:#7fa3e0;
  --gW:#e086b0; --gU:#9a938a;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; margin:0;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- shell ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
header.top{
  border-bottom:1px solid var(--line); background:var(--bg);
  position:sticky; top:0; z-index:40;
}
.top-in{max-width:1120px;margin:0 auto;padding:14px 20px 0;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
.brand{font-size:23px;font-weight:700;letter-spacing:-.015em;margin:0}
.brand .bat{color:var(--turf)}
.tagline{color:var(--ink-3);font-size:12.5px;margin-left:auto;text-align:right;line-height:1.35}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  font:inherit;font-size:13.5px;font-weight:500;color:var(--ink-2);background:none;border:0;
  padding:9px 13px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--turf);border-bottom-color:var(--turf);font-weight:600}

section.tab{display:none;padding-top:26px}
section.tab.on{display:block}

/* ---------- bits ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.card-h .sub{color:var(--ink-3);font-size:12px;margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.muted{color:var(--ink-3)}
.tiny{font-size:12px}
.center{text-align:center}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
tr.total td{font-weight:700;background:var(--panel-2);border-top:1.5px solid var(--line-2)}
tr.total:hover td{background:var(--panel-2)}
.scroll{overflow-x:auto}
td.name,th.name{max-width:190px;overflow:hidden;text-overflow:ellipsis}

.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-2);
}
.gdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}
.pill.warn{color:var(--ball);border-color:var(--ball);background:transparent}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}
.tile .k{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:"Source Serif 4",Georgia,serif;font-size:29px;font-weight:700;line-height:1.15;margin-top:3px;letter-spacing:-.02em}
.tile .m{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.tile.hi .v{color:var(--turf)}
.tile.ball .v{color:var(--ball)}

input,select{
  font:inherit;font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;width:100%;
}
input:focus,select:focus{outline:2px solid var(--turf);outline-offset:-1px;border-color:var(--turf)}
label.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}

/* search */
.search-wrap{position:relative;max-width:460px}
.results{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;max-height:320px;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line-2);border-radius:9px;box-shadow:var(--shadow);display:none;
}
.results.on{display:block}
.results button{
  display:block;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink);
  background:none;border:0;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)
}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.sel{background:var(--panel-2);color:var(--turf)}
.results button .r{float:right;color:var(--ink-3);font-size:12px}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;align-items:center}
.recent button{font:inherit;font-size:12.5px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:3px 11px;color:var(--ink-2);cursor:pointer}
.recent button:hover{border-color:var(--turf);color:var(--turf)}

.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:24px 0 16px}
.phead h2{margin:0;font-size:31px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.phead .meta{color:var(--ink-2);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}

.note{
  border-left:3px solid var(--gold);background:var(--panel);border-radius:0 8px 8px 0;
  padding:10px 14px;font-size:12.5px;color:var(--ink-2);margin-top:14px
}
.note b{color:var(--ink)}
.note ul{margin:6px 0 0;padding-left:18px}

.bar{display:block;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--turf);border-radius:3px}
.bar.b i{background:var(--ball)}
.rank{color:var(--ink-3);font-size:12px;width:22px;display:inline-block}
a.pl{color:inherit;text-decoration:none;border-bottom:1px solid transparent;cursor:pointer}
a.pl:hover{color:var(--turf);border-bottom-color:var(--turf)}

svg.chart{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-3);padding:0 16px 13px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}

.ctrls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.ctrls>div{min-width:150px}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px}
.foot code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:11.5px}
@media (max-width:600px){
  .phead h2{font-size:25px}
  .tile .v{font-size:24px}
  .chips{margin-left:0;width:100%}
  .tagline{margin-left:0;text-align:left}
}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="brand serif"><span class="bat">&#127951;</span> The Scorebook</h1>
    <div class="tagline" id="tagline"></div>
  </div>
  <div class="top-in" style="padding-top:0">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="player" aria-selected="true">Player</button>
      <button role="tab" data-tab="boards" aria-selected="false">Top 10s</button>
      <button role="tab" data-tab="records" aria-selected="false">Records</button>
      <button role="tab" data-tab="compare" aria-selected="false">Compare</button>
      <button role="tab" data-tab="season" aria-selected="false">Season</button>
      <button role="tab" data-tab="audit" aria-selected="false">Data audit</button>
    </nav>
  </div>
</header>

<div class="wrap">

  <section class="tab on" id="tab-player">
    <div class="search-wrap">
      <label class="lbl" for="q">Find a player</label>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Start typing a surname&hellip;">
      <div class="results" id="results"></div>
    </div>
    <div class="recent" id="recent"></div>
    <div id="player"></div>
  </section>

  <section class="tab" id="tab-boards"></section>
  <section class="tab" id="tab-records"></section>

  <section class="tab" id="tab-compare">
    <div class="ctrls">
      <div style="flex:1"><label class="lbl" for="cmpA">Player</label><select id="cmpA"></select></div>
      <div style="flex:1"><label class="lbl" for="cmpB">Player</label><select id="cmpB"></select></div>
      <div><label class="lbl" for="cmpG">Grade</label><select id="cmpG"></select></div>
    </div>
    <div id="cmpOut"></div>
  </section>

  <section class="tab" id="tab-season">
    <div class="ctrls">
      <div><label class="lbl" for="seasonSel">Season</label><select id="seasonSel"></select></div>
      <div><label class="lbl" for="seasonG">Grade</label><select id="seasonG"></select></div>
    </div>
    <div id="seasonOut"></div>
  </section>

  <section class="tab" id="tab-audit"></section>

  <div class="foot" id="foot"></div>
</div>

  tabs.forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===id)));
  document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on', s.id==='tab-'+id));
  if(!built[id]){ built[id]=1; (BUILD[id]||(()=>{}))(); }
  window.scrollTo({top:0,behavior:'instant'});
}
tabs.forEach(b=>b.onclick=()=>{ show(b.dataset.tab); writeHash(); });

/* ---------- hash + local memory ---------- */
let current = null;
function writeHash(){
  const active = tabs.find(b=>b.getAttribute('aria-selected')==='true');
  const t = active ? active.dataset.tab : 'player';
  const h = t==='player' && current!=null ? '#p='+encodeURIComponent(NAMES[current]) : '#'+t;
  history.replaceState(null,'',h);
}
function readHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,''));
  if(h.startsWith('p=')){ const i=NAMES.indexOf(h.slice(2)); if(i>=0){ showPlayer(i,false); return; } }
  if(h && tabs.some(b=>b.dataset.tab===h)) show(h);
}
const LS='scorebook.recent';
function recent(){ try{ return JSON.parse(localStorage.getItem(LS))||[] }catch(e){ return [] } }
function remember(name){
  try{ const r=[name,...recent().filter(x=>x!==name)].slice(0,6);
    localStorage.setItem(LS,JSON.stringify(r)); }catch(e){}
  drawRecent();
}
function drawRecent(){
  const r=recent().filter(n=>NAMES.includes(n));
  document.getElementById('recent').innerHTML = r.length
    ? '<span class="tiny muted">Recent:</span>' + r.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join('')
    : '';
  document.querySelectorAll('#recent button').forEach(b=>
    b.onclick=()=>{ showPlayer(NAMES.indexOf(b.dataset.n)); });
}

/* ---------- search ---------- */
const qEl=document.getElementById('q'), resEl=document.getElementById('results');
const careerRuns = NAMES.map((_,i)=>byPlayer[i].reduce((t,r)=>t+(r[R]||0),0));
let matches=[], selIdx=-1;
function search(v){
  const q=v.trim().toLowerCase();
  if(!q){ resEl.classList.remove('on'); return; }
  const starts=[], has=[];
  NAMES.forEach((n,i)=>{
    const l=n.toLowerCase();
    if(l.startsWith(q)) starts.push(i);
    else if(l.includes(q)) has.push(i);
  });
  matches=[...starts,...has].slice(0,40); selIdx=-1;
  resEl.innerHTML = matches.length
    ? matches.map((i,k)=>`<button data-i="${i}"${k===0?' class="sel"':''}>${esc(NAMES[i])}
        <span class="r num">${careerRuns[i]} runs</span></button>`).join('')
    : '<button disabled class="muted">No player of that name</button>';
  if(matches.length) selIdx=0;
  resEl.classList.add('on');
  resEl.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>showPlayer(+b.dataset.i));
}
qEl.oninput = e => search(e.target.value);
qEl.onfocus = e => { if(e.target.value) search(e.target.value); };
qEl.onkeydown = e => {
  if(!matches.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    selIdx=(selIdx+(e.key==='ArrowDown'?1:-1)+matches.length)%matches.length;
    resEl.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('sel',k===selIdx));
    resEl.querySelectorAll('button')[selIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter' && selIdx>=0){ showPlayer(matches[selIdx]); }
  else if(e.key==='Escape'){ resEl.classList.remove('on'); }
};
document.addEventListener('click', e=>{
  if(!e.target.closest('.search-wrap')) resEl.classList.remove('on');
});

function topScoreWhere(rows,hs){
  if(hs==null) return '&ndash;';
  const r=rows.find(x=>x[HS]===hs);
  return r ? `${gLabel(GRADES[r[G]])}, ${SEASONS[r[S]]}` : '';
}

/* ---------- career chart ---------- */
function careerChart(rows){
  const bySeason={};
  rows.filter(r=>realSeason(r[S])).forEach(r=>{
    const s=SEASONS[r[S]];
    const o=bySeason[s]||(bySeason[s]={runs:0,wkts:0,byGrade:{}});
    o.runs+=r[R]||0; o.wkts+=r[W]||0;
    o.byGrade[GRADES[r[G]]]=(o.byGrade[GRADES[r[G]]]||0)+(r[R]||0);
  });
  const keys=Object.keys(bySeason).sort((a,b)=>seasonYear(a)-seasonYear(b));
  if(keys.length<2) return '';
  return chartSvg(keys,bySeason);
}
function chartSvg(keys,bySeason){
  const w=980,h=240,pl=46,pr=46,pt=16,pb=36;
  const iw=w-pl-pr, ih=h-pt-pb;
  const maxR=Math.max(10,...keys.map(k=>bySeason[k].runs));
  const maxW=Math.max(4,...keys.map(k=>bySeason[k].wkts));
  const bw=Math.max(3,Math.min(28,iw/keys.length-3));
  const x=i=>pl+(iw/keys.length)*(i+.5);
  const yR=v=>pt+ih-(v/maxR)*ih;
  const yW=v=>pt+ih-(v/maxW)*ih;
  const grades=[...new Set(keys.flatMap(k=>Object.keys(bySeason[k].byGrade)))]
    .sort((a,b)=>GRADES.indexOf(a)-GRADES.indexOf(b));
  let bars='';
  keys.forEach((k,i)=>{
    const o=bySeason[k];
    let acc=0;
    grades.forEach(g=>{
      const v=o.byGrade[g]||0; if(!v) return;
      const y0=yR(acc), y1=yR(acc+v);
      bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}"
        height="${Math.max(.7,y0-y1).toFixed(1)}" fill="${gcol(g)}" opacity=".9" rx="1">
        <title>${k} &middot; ${gLabel(g)}: ${v} runs</title></rect>`;
      acc+=v;
    });
  });
  const line=keys.map((k,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${yW(bySeason[k].wkts).toFixed(1)}`).join(' ');
  const dots=keys.map((k,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yW(bySeason[k].wkts).toFixed(1)}" r="2.6"
     fill="var(--ball)"><title>${k}: ${bySeason[k].wkts} wickets</title></circle>`).join('');
  const step=Math.ceil(keys.length/14);
  const labels=keys.map((k,i)=> i%step ? '' :
    `<text x="${x(i).toFixed(1)}" y="${h-14}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${k.slice(2,5)+k.slice(5)}</text>`).join('');
  const gridY=[0,.5,1].map(f=>{
    const y=pt+ih-f*ih;
    return `<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${pl-7}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${Math.round(maxR*f)}</text>
      <text x="${w-pr+7}" y="${y+3.5}" font-size="10" fill="var(--ball)">${Math.round(maxW*f)}</text>`;
  }).join('');
  return `<div class="card" style="margin-top:16px">
    <div class="card-h"><h3>Career by season</h3><span class="sub">runs stacked by grade &middot; wickets as the line</span></div>
    <div style="padding:10px 6px 0"><svg class="chart" viewBox="0 0 ${w} ${h}" role="img"
      aria-label="Runs and wickets by season">${gridY}${bars}
      <path d="${line}" fill="none" stroke="var(--ball)" stroke-width="1.8" stroke-linejoin="round"/>
      ${dots}${labels}</svg></div>
    <div class="legend">${grades.map(g=>`<span><i class="sw" style="background:${gcol(g)}"></i>${gLabel(g)} runs</span>`).join('')}
      <span><i class="sw" style="background:var(--ball);border-radius:50%"></i>Wickets</span></div>
  </div>`;
}

/* ---------- leaderboards ---------- */
function tally(field, gradeFilter, opts={}){
  const t=new Map();
  for(const r of ROWS){
    if(gradeFilter && GRADES[r[G]]!==gradeFilter) continue;
    const v=r[field]; if(v==null) continue;
    const e=t.get(r[N])||{v:0,miss:0};
    e.v+=v;
    t.set(r[N],e);
  }
  if(field===GM) for(const r of ROWS){
    if(gradeFilter && GRADES[r[G]]!==gradeFilter) continue;
    if(r[GM]==null && (r[R]!=null||r[W]!=null)){
      const e=t.get(r[N])||{v:0,miss:0}; e.miss++; t.set(r[N],e);
    }
  }
  return [...t.entries()].map(([i,e])=>({i,v:e.v,miss:e.miss}))
    .filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,opts.top||10);
}
function boardCard(title,sub,list,unit,tone){
  const max=list.length?list[0].v:1;
  return `<div class="card">
    <div class="card-h"><h3>${title}</h3><span class="sub">${sub}</span></div>
    <div class="scroll"><table><tbody>
      ${list.map((x,k)=>`<tr>
        <td class="name"><span class="rank num">${k+1}</span><a class="pl" data-i="${x.i}">${esc(NAMES[x.i])}</a>
          ${x.miss?'<span class="pill warn" title="some rows record no games">part</span>':''}</td>
        <td style="width:34%"><span class="bar${tone==='b'?' b':''}"><i style="width:${(x.v/max*100).toFixed(1)}%"></i></span></td>
        <td class="num" style="font-weight:600">${x.v}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function aveBoard(kind, minQ){
  const t=new Map();
  for(const r of ROWS){
    const e=t.get(r[N])||{runs:0,outs:0,inn:0,conc:0,wkts:0};
    e.runs+=r[R]||0; e.outs+=r[OUT]||0; e.inn+=r[IN]||0; e.conc+=r[RC]||0; e.wkts+=r[W]||0;
    t.set(r[N],e);
  }
  const out=[];
  t.forEach((e,i)=>{
    if(kind==='bat'){ if(e.inn>=minQ && e.outs>0) out.push({i,v:e.runs/e.outs,q:e.inn,extra:e.runs}); }
    else { if(e.wkts>=minQ) out.push({i,v:e.conc/e.wkts,q:e.wkts,extra:e.conc}); }
  });
  out.sort((a,b)=> kind==='bat' ? b.v-a.v : a.v-b.v);
  return out.slice(0,10);
}
function aveCard(kind,minQ){
  const list=aveBoard(kind,minQ);
  const label = kind==='bat' ? 'inns' : 'wkts';
  return `<div class="card">
    <div class="card-h"><h3>${kind==='bat'?'Best batting average':'Best bowling average'}</h3>
      <span class="sub">min ${minQ} career ${label}</span></div>
    <div class="scroll"><table>
      <thead><tr><th class="name">Player</th><th>${kind==='bat'?'Inns':'Wkts'}</th><th>${kind==='bat'?'Runs':'Runs'}</th><th>Ave</th></tr></thead>
      <tbody>${list.map((x,k)=>`<tr><td class="name"><span class="rank num">${k+1}</span>
        <a class="pl" data-i="${x.i}">${esc(NAMES[x.i])}</a></td>
        <td class="num">${x.q}</td><td class="num">${x.extra}</td>
        <td class="num" style="font-weight:600">${x.v.toFixed(2)}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
}

/* ---------- records ---------- */
BUILD.records=()=>{
  const knocks=ROWS.filter(r=>r[HS]!=null).map(r=>({i:r[N],v:r[HS],s:SEASONS[r[S]],g:GRADES[r[G]]}))
    .sort((a,b)=>b.v-a.v).slice(0,12);
  const spells=ROWS.filter(r=>r[BW]!=null&&r[BW]>0)
    .map(r=>({i:r[N],w:r[BW],r:r[BR],s:SEASONS[r[S]],g:GRADES[r[G]]}))
    .sort((a,b)=>b.w-a.w||a.r-b.r).slice(0,12);
  const sum=(f)=>{const t=new Map();ROWS.forEach(r=>t.set(r[N],(t.get(r[N])||0)+(r[f]||0)));
    return [...t].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,10);};
  const careers=NAMES.map((n,i)=>{
    const ys=[...agg(byPlayer[i]).seasons].sort((a,b)=>seasonYear(a)-seasonYear(b));
    return {i,n:ys.length,first:ys[0],last:ys[ys.length-1]};
  }).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
  const allround=NAMES.map((_,i)=>{const a=agg(byPlayer[i]);return {i,runs:a.runs,wkts:a.wkts};})
    .filter(x=>x.runs>=1000&&x.wkts>=50).sort((a,b)=>(b.runs+b.wkts*20)-(a.runs+a.wkts*20)).slice(0,10);

  const simple=(title,sub,list,fmt)=>`<div class="card">
    <div class="card-h"><h3>${title}</h3><span class="sub">${sub}</span></div>
    <div class="scroll"><table><tbody>${list.map((x,k)=>`<tr>
      <td class="name"><span class="rank num">${k+1}</span>${fmt.name(x)}</td>
      <td class="num" style="font-weight:600;text-align:right">${fmt.val(x)}</td>
      <td class="num muted tiny">${fmt.note?fmt.note(x):''}</td></tr>`).join('')}</tbody></table></div></div>`;

  document.getElementById('tab-records').innerHTML=`
    <div class="tiles" style="margin-bottom:18px">
      <div class="tile hi"><div class="k">Highest score</div><div class="v num">${knocks[0].v}</div>
        <div class="m">${esc(NAMES[knocks[0].i])}, ${knocks[0].s}</div></div>
      <div class="tile ball"><div class="k">Best bowling</div><div class="v num">${spells[0].w}/${spells[0].r}</div>
        <div class="m">${esc(NAMES[spells[0].i])}, ${spells[0].s}</div></div>
      <div class="tile"><div class="k">Seasons covered</div><div class="v num">${D.meta.firstSeason.slice(0,4)}&ndash;20${D.meta.lastSeason.slice(5)}</div>
        <div class="m num">${SEASONS.filter(s=>s!=='Unknown').length} seasons on record</div></div>
      <div class="tile"><div class="k">Players</div><div class="v num">${NAMES.length}</div>
        <div class="m num">${D.meta.seasonRows} season rows</div></div>
    </div>
    <div class="grid g2">
      ${simple('Highest individual scores','all grades',knocks,{
        name:x=>`<a class="pl" data-i="${x.i}">${esc(NAMES[x.i])}</a>`,
        val:x=>x.v, note:x=>`${gShort(x.g)} &middot; ${x.s}`})}
      ${simple('Best bowling figures','all grades',spells,{
        name:x=>`<a class="pl" data-i="${x.i}">${esc(NAMES[x.i])}</a>`,
        val:x=>`${x.w}/${x.r}`, note:x=>`${gShort(x.g)} &middot; ${x.s}`})}
      ${simple('Most centuries','career',sum(F100),{
        name:x=>`<a class="pl" data-i="${x[0]}">${esc(NAMES[x[0]])}</a>`, val:x=>x[1]})}
      ${simple('Most five-wicket hauls','career',sum(F5),{
        name:x=>`<a class="pl" data-i="${x[0]}">${esc(NAMES[x[0]])}</a>`, val:x=>x[1]})}
      ${simple('Most fifties','career',sum(F50),{
        name:x=>`<a class="pl" data-i="${x[0]}">${esc(NAMES[x[0]])}</a>`, val:x=>x[1]})}
      ${simple('Longest careers','seasons played',careers,{
        name:x=>`<a class="pl" data-i="${x.i}">${esc(NAMES[x.i])}</a>`,
        val:x=>x.n, note:x=>`${x.first} &ndash; ${x.last}`})}
    </div>
    <h2 class="serif" style="margin:34px 0 14px;font-size:22px">The all-rounders</h2>
    <div class="card">
      <div class="card-h"><h3>1000 runs and 50 wickets</h3><span class="sub">${allround.length} players in the club's history</span></div>
      <div class="scroll"><table>
        <thead><tr><th class="name">Player</th><th>Runs</th><th>Wickets</th></tr></thead>
        <tbody>${allround.map((x,k)=>`<tr><td class="name"><span class="rank num">${k+1}</span>
          <a class="pl" data-i="${x.i}">${esc(NAMES[x.i])}</a></td>
          <td class="num">${x.runs}</td><td class="num">${x.wkts}</td></tr>`).join('')}</tbody>
      </table></div></div>`;
  wireNames(document.getElementById('tab-records'));
};

/* ---------- compare ---------- */
BUILD.compare=()=>{
  const A=document.getElementById('cmpA'), B=document.getElementById('cmpB'), Gs=document.getElementById('cmpG');
  const opts=NAMES.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');
  const order=NAMES.map((_,i)=>i).sort((a,b)=>careerRuns[b]-careerRuns[a]);
  A.innerHTML=opts; B.innerHTML=opts;
  Gs.innerHTML='<option value="">All grades</option>'+GRADES.map(g=>`<option value="${g}">${gLabel(g)}</option>`).join('');
  A.value=order[0]; B.value=order[1];
  const draw=()=>{
    const g=Gs.value;
    const idx=(el,fb)=>{ const v=parseInt(el.value,10); return byPlayer[v] ? v : fb; };
    const ia=idx(A,order[0]), ib=idx(B,order[1]);
    const pick=i=>agg(byPlayer[i].filter(r=>!g||GRADES[r[G]]===g));
    const a=pick(ia), b=pick(ib);
    const line=(k,va,vb,better)=>{
      const na=va==null?-Infinity:va, nb=vb==null?-Infinity:vb;
      const win = na===nb ? 0 : (better==='hi' ? (na>nb?1:2) : (na<nb?1:2));
      const f=v=>v==null?'&ndash;':(typeof v==='number'&&!Number.isInteger(v)?v.toFixed(2):v);
      return `<tr><td class="num" style="text-align:right;font-weight:${win===1?700:400};color:${win===1?'var(--turf)':'inherit'}">${f(va)}</td>
        <th style="text-align:center;text-transform:none;font-size:12px;letter-spacing:0">${k}</th>
        <td class="num" style="font-weight:${win===2?700:400};color:${win===2?'var(--turf)':'inherit'}">${f(vb)}</td></tr>`;
    };
    document.getElementById('cmpOut').innerHTML=`<div class="card">
      <div class="card-h"><h3>${esc(NAMES[ia])} v ${esc(NAMES[ib])}</h3>
        <span class="sub">${g?gLabel(g):'all grades'}</span></div>
      <div class="scroll"><table><tbody>
        ${line('Seasons',a.seasons.size,b.seasons.size,'hi')}
        ${line('Games',a.games,b.games,'hi')}
        ${line('Runs',a.runs,b.runs,'hi')}
        ${line('Batting average',a.ave,b.ave,'hi')}
        ${line('Top score',a.hs,b.hs,'hi')}
        ${line('50s',a.f50,b.f50,'hi')}
        ${line('100s',a.f100,b.f100,'hi')}
        ${line('Wickets',a.wkts,b.wkts,'hi')}
        ${line('Bowling average',a.bave,b.bave,'lo')}
        ${line('5wi',a.f5,b.f5,'hi')}
      </tbody></table></div></div>`;
  };
  A.onchange=draw; B.onchange=draw; Gs.onchange=draw; draw();
};

/* ---------- season ---------- */
BUILD.season=()=>{
  const sel=document.getElementById('seasonSel'), gs=document.getElementById('seasonG');
  const real=SEASONS.filter(s=>s!=='Unknown').sort((a,b)=>seasonYear(b)-seasonYear(a));
  sel.innerHTML=real.map(s=>`<option>${s}</option>`).join('');
  gs.innerHTML='<option value="">All grades</option>'+GRADES.map(g=>`<option value="${g}">${gLabel(g)}</option>`).join('');
  const draw=()=>{
    const s=sel.value, g=gs.value;
    const rs=ROWS.filter(r=>SEASONS[r[S]]===s && (!g||GRADES[r[G]]===g));
    const t=new Map();
    rs.forEach(r=>{
      const e=t.get(r[N])||{runs:0,wkts:0,games:0,hs:null,inn:0,outs:0,conc:0,best:null};
      e.runs+=r[R]||0; e.wkts+=r[W]||0; e.games+=r[GM]||0; e.inn+=r[IN]||0; e.outs+=r[OUT]||0; e.conc+=r[RC]||0;
      if(r[HS]!=null&&(e.hs==null||r[HS]>e.hs)) e.hs=r[HS];
      if(r[BW]!=null&&(!e.best||r[BW]>e.best.w||(r[BW]===e.best.w&&r[BR]<e.best.r))) e.best={w:r[BW],r:r[BR]};
      t.set(r[N],e);
    });
    const arr=[...t.entries()];
    const bat=arr.filter(x=>x[1].runs>0).sort((a,b)=>b[1].runs-a[1].runs).slice(0,10);
    const bowl=arr.filter(x=>x[1].wkts>0).sort((a,b)=>b[1].wkts-a[1].wkts).slice(0,10);
    const tot=rs.reduce((o,r)=>({runs:o.runs+(r[R]||0),wkts:o.wkts+(r[W]||0)}),{runs:0,wkts:0});
    document.getElementById('seasonOut').innerHTML=`
      <div class="tiles" style="margin-bottom:16px">
        <div class="tile"><div class="k">Players used</div><div class="v num">${arr.length}</div><div class="m">${s}</div></div>
        <div class="tile hi"><div class="k">Runs scored</div><div class="v num">${tot.runs}</div><div class="m">${g?gLabel(g):'all grades'}</div></div>
        <div class="tile ball"><div class="k">Wickets taken</div><div class="v num">${tot.wkts}</div><div class="m">${g?gLabel(g):'all grades'}</div></div>
      </div>
      <div class="grid g2">
        <div class="card"><div class="card-h"><h3>Leading run scorers</h3><span class="sub">${s}</span></div>
          <div class="scroll"><table><thead><tr><th class="name">Player</th><th>Runs</th><th>HS</th><th>Ave</th></tr></thead>
          <tbody>${bat.map((x,k)=>`<tr><td class="name"><span class="rank num">${k+1}</span>
            <a class="pl" data-i="${x[0]}">${esc(NAMES[x[0]])}</a></td><td class="num">${x[1].runs}</td>
            <td class="num">${x[1].hs??'&ndash;'}</td>
            <td class="num">${x[1].outs?(x[1].runs/x[1].outs).toFixed(2):'&ndash;'}</td></tr>`).join('')
            ||'<tr><td colspan="4" class="muted center">Nothing recorded</td></tr>'}</tbody></table></div></div>
        <div class="card"><div class="card-h"><h3>Leading wicket takers</h3><span class="sub">${s}</span></div>
          <div class="scroll"><table><thead><tr><th class="name">Player</th><th>Wkts</th><th>Best</th><th>Ave</th></tr></thead>
          <tbody>${bowl.map((x,k)=>`<tr><td class="name"><span class="rank num">${k+1}</span>
            <a class="pl" data-i="${x[0]}">${esc(NAMES[x[0]])}</a></td><td class="num">${x[1].wkts}</td>
            <td class="num">${x[1].best?x[1].best.w+'/'+x[1].best.r:'&ndash;'}</td>
            <td class="num">${(x[1].conc/x[1].wkts).toFixed(2)}</td></tr>`).join('')
            ||'<tr><td colspan="4" class="muted center">Nothing recorded</td></tr>'}</tbody></table></div></div>
      </div>`;
    wireNames(document.getElementById('seasonOut'));
  };
  sel.onchange=draw; gs.onchange=draw; draw();
};

/* ---------- audit ---------- */
BUILD.audit=()=>{
  const missing=[];
  const perPlayer=new Map();
  ROWS.forEach(r=>{
    if(r[GM]==null && (r[R]!=null||r[W]!=null)){
      perPlayer.set(r[N],(perPlayer.get(r[N])||0)+1);
      missing.push(r);
    }
  });
  const unkGrade=ROWS.filter(r=>GRADES[r[G]]==='Unknown');
  const unkSeason=ROWS.filter(r=>SEASONS[r[S]]==='Unknown');
  const d=D.discrepancies||[];
  document.getElementById('tab-audit').innerHTML=`
    <p class="muted" style="max-width:70ch;margin:0 0 18px">Every figure in this portal is recomputed from the
    season rows of the master sheet. This page lists what the sheet cannot answer cleanly, so it doubles as a
    to-do list for tidying the source.</p>
    <div class="tiles" style="margin-bottom:20px">
      <div class="tile"><div class="k">Rows with no games</div><div class="v num">${missing.length}</div>
        <div class="m num">${perPlayer.size} players affected</div></div>
      <div class="tile"><div class="k">Rows with no grade</div><div class="v num">${unkGrade.length}</div>
        <div class="m">counted in All Grades only</div></div>
      <div class="tile"><div class="k">Rows with no season</div><div class="v num">${unkSeason.length}</div>
        <div class="m">excluded from career charts</div></div>
      <div class="tile ball"><div class="k">Totals that disagree</div><div class="v num">${d.length}</div>
        <div class="m">sheet total vs season rows</div></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>The sheet's own totals that don't match its season rows</h3>
        <span class="sub">portal uses the season rows</span></div>
      <div class="scroll"><table>
        <thead><tr><th class="name">Player</th><th>Field</th><th>Sheet total says</th><th>Season rows add to</th><th>Out by</th></tr></thead>
        <tbody>${d.slice(0,120).map(x=>`<tr>
          <td class="name"><a class="pl" data-n="${esc(x.player)}">${esc(x.player)}</a></td>
          <td style="text-align:right">${x.field}</td><td class="num">${x.sheet}</td>
          <td class="num">${x.computed}</td>
          <td class="num" style="color:var(--ball);font-weight:600">${x.sheet>x.computed?'&minus;':'+'}${Math.abs(x.sheet-x.computed)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      ${d.length>120?`<div style="padding:11px 16px" class="tiny muted">Showing 120 of ${d.length}.</div>`:''}
    </div>
    ${(D.flags||[]).length?`<div class="card" style="margin-top:16px">
      <div class="card-h"><h3>Cells that needed interpreting</h3><span class="sub">${D.flags.length} in total</span></div>
      <div class="scroll"><table><thead><tr><th class="name">Player</th><th style="text-align:left">What was found</th></tr></thead>
      <tbody>${D.flags.map(f=>`<tr><td class="name"><a class="pl" data-n="${esc(f.player)}">${esc(f.player)}</a></td>
        <td style="text-align:left;white-space:normal">${esc(f.detail)}</td></tr>`).join('')}</tbody></table></div></div>`:''}
    ${Object.keys(D.aliases||{}).length?`<div class="card" style="margin-top:16px">
      <div class="card-h"><h3>Names merged into one career</h3><span class="sub">worth fixing at source</span></div>
      <div class="scroll"><table><thead><tr><th class="name">Kept as</th><th style="text-align:left">Also spelt</th></tr></thead>
      <tbody>${Object.entries(D.aliases).map(([k,v])=>`<tr>
        <td class="name"><a class="pl" data-n="${esc(k)}">${esc(k)}</a></td>
        <td style="text-align:left">${v.map(esc).join(', ')}</td></tr>`).join('')}</tbody></table></div></div>`:''}
    <div class="note"><b>Other things worth knowing</b><ul>
      <li>A wicketkeeping table of ${D.meta.keeperRowsIgnored} per&#8209;match rows sits below the main data in the
        sheet. Its <i>Wkts</i> column counts dismissals behind the stumps, not bowling wickets, so it is excluded
        here rather than corrupting the bowling figures.</li>
      <li>Rows labelled grade 6 or Vets carry no figures at all in the sheet, so those grades don't appear.</li>
      <li>Overs are added as recorded. Pre&#8209;1980 South Australian club cricket used eight&#8209;ball overs,
        so overs totals spanning that change are approximate; wickets, runs and averages are unaffected.</li>
    </ul></div>`;
  wireNames(document.getElementById('tab-audit'));
};

/* ---------- wiring ---------- */
function wireNames(root){
  root.querySelectorAll('a.pl').forEach(a=>a.onclick=()=>{
    const i = a.dataset.i!=null ? +a.dataset.i : NAMES.indexOf(a.dataset.n);
    if(i>=0) showPlayer(i);
  });
}
document.getElementById('tagline').innerHTML =
  `${NAMES.length} players &middot; ${SEASONS.filter(s=>s!=='Unknown').length} seasons &middot; ${D.meta.firstSeason} to ${D.meta.lastSeason}<br>
   recomputed from ${D.meta.seasonRows} season rows`;
document.getElementById('foot').innerHTML =
  `Built from the <b>${esc(D.meta.source)}</b> sheet. Career figures are recomputed from the season rows rather
   than read from the sheet's <code>total / all</code> rows, which do not always agree with them &mdash; see the
   Data audit tab. Batting average is runs &divide; dismissals; bowling average is runs &divide; wickets; best
   bowling is ranked by wickets, then by fewest runs conceded. Unknown&#8209;grade rows count towards All Grades
   only, so grade lines need not add up to the All Grades line.`;

drawRecent();
const startOrder = NAMES.map((_,i)=>i).sort((a,b)=>careerRuns[b]-careerRuns[a]);
showPlayer(startOrder[0], false);
readHash();
window.addEventListener('hashchange',readHash);
</script>
